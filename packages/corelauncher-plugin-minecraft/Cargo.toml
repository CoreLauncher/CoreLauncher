[package]
name = "corelauncher-plugin-minecraft"
version = "0.1.0"
edition = "2024"

[dependencies]
corelauncher-types.workspace = true
minecraft.workspace = true

# Database
database.workspace = true
rusqlite = { version = "0.40.0", features = ["bundled"] }
include_dir = "0.7.4"

# Async
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
async-trait = "0.1.92"

rust-embed-addon.workspace = true
rust-embed = { version = "8.11.0", features = ["debug-embed"] }
webbrowser = "1.2.1"
url = "2.5.8"
reqwest = { version = "0.13.4", features = ["json"] }
